# Exports the Godot project as a web page and pushes it to the `web-build` branch
# (index.html + files), ready to be hosted anywhere that serves static files.
name: Export web

on:
  push:
    branches: [main]
    paths:
      - "project/**"
      - ".github/workflows/export-web.yml"
  workflow_run:
    workflows: ["Build engine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: export-web
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -q -j templates.tpz "templates/web_*" "templates/version.txt" -d $dest
          ls $dest

      - name: Smoke test (fails on any script error)
        timeout-minutes: 8
        run: |
          ./godot --headless --path project --import || true
          timeout 240 ./godot --headless --path project -s res://tests/smoke_test.gd > smoke.log 2>&1 || echo "smoke test exited with $?"
          head -c 20000 smoke.log
          # (a bare "! grep" never fails a step, so check explicitly)
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" smoke.log; then echo "smoke test found errors"; exit 1; fi
          grep -q "character runs" smoke.log
          grep -q "ok: soundboard" smoke.log

      - name: Export
        run: |
          mkdir -p web
          ./godot --headless --path project --import || true
          ./godot --headless --path project --export-release "Web" ../web/index.html
          ls -la web
          test -f web/index.html

      - name: Push to web-build branch
        run: |
          cd web
          touch .nojekyll
          git init -q -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web export of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-build
